name: Render Small PDF OCR Inputs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pending small PDFs inspected
        default: "100"
        type: string
      render_band:
        description: Source PDF size band assigned to this runner
        default: "under16"
        type: string
      generate_jxl:
        description: Also encode optional JXL page images (Reader currently uses WebP)
        default: false
        type: boolean
      retry_failed:
        description: Retry failed rendering for unchanged sources
        default: true
        type: boolean
      source_repo:
        description: Exact source dataset filter, or blank for all
        default: ""
        type: string
      source_path_prefix:
        description: Source path prefix filter, or blank for all
        default: ""
        type: string
      force_reprobe:
        description: Re-probe and rebuild the selected source paths
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ format('pdf-render-small-inputs-{0}', inputs.render_band || 'under16') }}
  cancel-in-progress: false
  queue: max

env:
  PDF_JXL_ENABLED: ${{ inputs.generate_jxl == true }}
  PDF_PNG_ARCHIVE_BUCKET: melsm/pdf-archive
  PDF_JXL_ARCHIVE_BUCKET: melsm/pdf-jxl

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Fetch source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan small PDF rendering
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
          LIMIT: ${{ inputs.limit || '100' }}
          RENDER_BAND: ${{ inputs.render_band || 'under16' }}
          RETRY_FAILED: ${{ github.event_name == 'schedule' || inputs.retry_failed }}
          SOURCE_REPO: ${{ inputs.source_repo || '' }}
          SOURCE_PATH_PREFIX: ${{ inputs.source_path_prefix || '' }}
          FORCE_REPROBE: ${{ inputs.force_reprobe || 'false' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && ((10#$LIMIT >= 1 && 10#$LIMIT <= 100)) || exit 1
          [[ "$RENDER_BAND" == under16 || "$RENDER_BAND" == 16to32 || "$RENDER_BAND" == 32to64 || "$RENDER_BAND" == 64to100 ]] || exit 1
          args=()
          if [[ "$RETRY_FAILED" == true ]]; then args+=(--retry-failed); fi
          if [[ "$FORCE_REPROBE" == true ]]; then args+=(--force-reprobe); fi
          python scripts/pdf_ocr_stages.py plan-render --partition "$RENDER_BAND" --native-text-stream --source-repo "$SOURCE_REPO" --source-path-prefix "$SOURCE_PATH_PREFIX" --limit "$LIMIT" --checkpoint 0 "${args[@]}"
          echo "shard_count=$(jq -r '.shard_count' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "shard_ids=$(jq -c '.shard_ids' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-render-small-queue
          path: output/pdf-ocr/queue.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.shard_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install rendering tools
        run: |
          packages=(poppler-utils fonts-noto-cjk)
          if [[ "$PDF_JXL_ENABLED" == true ]]; then packages+=(libjxl-tools); fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - uses: actions/download-artifact@v8
        with:
          name: pdf-render-small-queue
          path: output/pdf-ocr
      - name: Render and upload small PDF pages
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
        run: python scripts/pdf_ocr_stages.py render --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-render-small-results-${{ matrix.shard }}
          path: output/pdf-ocr/bundle/results-*.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reader-assets
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: pdf-render-small-queue
          path: output/pdf-ocr
      - uses: actions/download-artifact@v8
        if: needs.build.result != 'skipped'
        with:
          pattern: pdf-render-small-results-*
          path: output/pdf-ocr/results
      - name: Publish small PDF streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
        run: python scripts/pdf_ocr_stages.py publish-render --results-dir output/pdf-ocr/results
      - name: Queue Reader sidecar publication in main pipeline
        if: inputs.source_repo !=  && inputs.source_path_prefix != 
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo || '' }}
          SOURCE_PATH_PREFIX: ${{ inputs.source_path_prefix || '' }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          test -n "${SOURCE_REPO}"
          test -n "${SOURCE_PATH_PREFIX}"
          jq -n --arg repo "$SOURCE_REPO" --arg path "$SOURCE_PATH_PREFIX" \
            '{ref:"main",inputs:{repo:$repo,path:$path,limit:"1",checkpoint_batches:"1",bucket_migrate:true,bucket_pdf_staging:false}}' \
            > "$RUNNER_TEMP/reader-assets-dispatch.json"
          curl --fail-with-body --silent --show-error -X POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/reader-assets-dispatch.json" \
            "https://api.github.com/repos/anftm/pipeline/actions/workflows/reader-assets.yml/dispatches"
