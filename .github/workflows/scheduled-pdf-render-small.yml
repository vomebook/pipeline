name: Schedule Small PDF Render

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Render Small PDF OCR Inputs]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: schedule-small-pdf-render
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    if: vars.PDF_RENDER_ENABLED != 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch small PDF renderer only when idle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          COMPLETED_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RENDER_BAND: ${{ vars.PDF_RENDER_BAND || 'under32' }}
          UPSTREAM_GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: python3 scripts/dispatch_pdf_stages.py small --render-band "$RENDER_BAND"
