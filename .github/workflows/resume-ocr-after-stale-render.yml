name: Resume OCR After Stale Render Repair

on:
  workflow_run:
    workflows: [Render Small PDF OCR Inputs]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: resume-ocr-after-stale-render
  cancel-in-progress: false
  queue: max

jobs:
  resume:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Resume OCR only after stale render repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          COMPLETED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          OCR_LANE_INDEX: ${{ vars.PDF_OCR_LANE_INDEX || '0' }}
          UPSTREAM_GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: python3 scripts/dispatch_pdf_stages.py small --lane-index "$OCR_LANE_INDEX" --repair-loop
