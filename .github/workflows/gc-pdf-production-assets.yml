name: GC Production PDF Assets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete unreferenced WebP/OCR/manifest objects; leave false for dry-run
        default: false
        type: boolean
      limit:
        description: Maximum production objects deleted in this run
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: gc-pdf-production-assets
  cancel-in-progress: false
  queue: max

jobs:
  gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Verify references and optionally delete stale production assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PDF_OCR_ENABLED: ${{ vars.PDF_OCR_ENABLED || 'true' }}
        run: |
          [[ "${{ inputs.limit || '1000' }}" =~ ^[1-9][0-9]*$ ]] || exit 1
          python scripts/gc_pdf_production_assets.py \
            --limit "${{ inputs.limit || '1000' }}" \
            ${{ inputs.apply == true && '--apply' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-production-gc-report-${{ github.run_id }}
          path: output/pdf-production-gc/report.json
          retention-days: 30
          if-no-files-found: warn
