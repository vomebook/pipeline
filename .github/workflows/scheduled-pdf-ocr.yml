name: Schedule PDF OCR

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Build PDF OCR Assets]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: schedule-pdf-ocr
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch OCR worker only when idle
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          REPO: ${{ github.repository }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          COMPLETED_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: python3 scripts/dispatch_pdf_stages.py ocr
