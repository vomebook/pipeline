name: Schedule PDF OCR

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch OCR worker only when idle
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          active=0
          for target_repo in "${REPO}" "anftm/pipeline"; do
            runs=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${target_repo}/actions/workflows/pdf-ocr-assets.yml/runs?per_page=20")
            count=$(printf '%s' "${runs}" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            active=$((active + count))
          done
          if ((active > 0)); then
            echo "PDF OCR worker already active or queued; no pending run will be created."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pdf-ocr-assets.yml/dispatches"
