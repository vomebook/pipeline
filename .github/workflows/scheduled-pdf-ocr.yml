name: Schedule PDF OCR

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Build PDF OCR Assets]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: schedule-pdf-ocr
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    if: vars.PDF_OCR_ENABLED != 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch OCR worker only when idle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          COMPLETED_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          OCR_LANE_INDEX: ${{ vars.PDF_OCR_LANE_INDEX || '0' }}
          UPSTREAM_GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: python3 scripts/dispatch_pdf_stages.py ocr --lane-index "$OCR_LANE_INDEX"
