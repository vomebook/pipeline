name: Build PDF OCR Assets

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum rendered books to process
        default: "20"
        type: string
      lane_index:
        description: Stable OCR lane index (0-3)
        default: "0"
        type: string
      target_pages:
        description: Target actual OCR pages per worker
        default: "1000"
        type: string
      lang:
        description: auto or a PaddleOCR language code such as ch, en, japan, ar, fa, or ku
        default: "auto"
        type: string
      backend:
        description: "OCR backend: paddle_static, paddle_onnxruntime, or rapidocr_onnxruntime"
        default: "rapidocr_onnxruntime"
        type: string
      retry_failed_only:
        description: Resume only incomplete or failed OCR books from saved page progress
        default: false
        type: boolean
      recover_run:
        description: Publish existing OCR artifacts from a completed main-branch OCR run
        default: ""
        type: string
      source_repo:
        description: Exact source dataset filter, or blank for all
        default: ""
        type: string
      source_path_prefix:
        description: Source path prefix filter, or blank for all
        default: ""
        type: string

permissions:
  contents: read
  actions: write

env:
  PDF_OCR_INPUT_BUCKET: ${{ vars.PDF_OCR_INPUT_BUCKET || 'vomebook/pdf-pages' }}
  PDF_PNG_ARCHIVE_BUCKET: melsm/pdf-archive
  PDF_JXL_ARCHIVE_BUCKET: melsm/pdf-jxl

concurrency:
  group: ${{ format('pdf-image-ocr-assets-{0}', inputs.lane_index || '0') }}
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Plan only published high quality PNG inputs
        if: inputs.recover_run == ''
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
          LIMIT: ${{ inputs.limit || '20' }}
          OCR_LANE_INDEX: ${{ inputs.lane_index || '0' }}
          PDF_OCR_TARGET_PAGES_PER_SHARD: ${{ inputs.target_pages || '1000' }}
          PDF_OCR_LANG: ${{ inputs.lang || 'auto' }}
          PDF_OCR_BACKEND: ${{ inputs.backend || 'rapidocr_onnxruntime' }}
          RETRY_FAILED_ONLY: ${{ inputs.retry_failed_only || 'false' }}
          SOURCE_REPO: ${{ inputs.source_repo || '' }}
          SOURCE_PATH_PREFIX: ${{ inputs.source_path_prefix || '' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && ((10#$LIMIT >= 1 && 10#$LIMIT <= 100)) || exit 1
          [[ "$OCR_LANE_INDEX" =~ ^[0-3]$ ]] || exit 1
          [[ "$PDF_OCR_TARGET_PAGES_PER_SHARD" =~ ^[0-9]+$ ]] && ((10#$PDF_OCR_TARGET_PAGES_PER_SHARD >= 1 && 10#$PDF_OCR_TARGET_PAGES_PER_SHARD <= 5000)) || exit 1
          args=()
          if [[ "$RETRY_FAILED_ONLY" == true ]]; then args+=(--retry-failed-only); fi
          python scripts/pdf_ocr_stages.py plan-ocr --source-repo "$SOURCE_REPO" --source-path-prefix "$SOURCE_PATH_PREFIX" --limit "$LIMIT" --ocr-lane-index "$OCR_LANE_INDEX" "${args[@]}"
          jq --argjson lane "$OCR_LANE_INDEX" --arg retry "$RETRY_FAILED_ONLY" ' . + {ocr_lane_index: $lane, retry_failed_only: ($retry == "true")}' output/pdf-ocr/queue.json > output/pdf-ocr/queue.tmp
          mv output/pdf-ocr/queue.tmp output/pdf-ocr/queue.json
          echo "shard_count=$(jq -r '.shard_count' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "shard_ids=$(jq -c '.shard_ids' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: inputs.recover_run == ''
        with:
          name: pdf-image-ocr-queue
          path: output/pdf-ocr/queue.json
          retention-days: 7

  build:
    needs: plan
    if: inputs.recover_run == '' && needs.plan.outputs.shard_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements-pdf-ocr.txt
      - uses: actions/cache@v5
        with:
          path: .cache/paddlex
          key: paddlex-${{ inputs.lang || 'auto' }}-${{ inputs.backend || 'rapidocr_onnxruntime' }}-${{ runner.os }}-${{ hashFiles('scripts/requirements-pdf-ocr.txt') }}
      - uses: actions/download-artifact@v8
        with:
          name: pdf-image-ocr-queue
          path: output/pdf-ocr
      - name: Recognize verified PNG pages without PDF rendering
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
          PADDLE_PDX_CACHE_HOME: ${{ github.workspace }}/.cache/paddlex
          PDF_OCR_LANG: ${{ inputs.lang || 'auto' }}
          PDF_OCR_BACKEND: ${{ inputs.backend || 'rapidocr_onnxruntime' }}
        run: python scripts/pdf_ocr_stages.py ocr --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-image-ocr-results-${{ matrix.shard }}
          path: output/pdf-ocr/bundle/results-*.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: reader-assets
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Validate recovery run identity
        if: inputs.recover_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RUN: ${{ inputs.recover_run }}
        run: |
          [[ "$RECOVER_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/${{ github.repository }}/actions/runs/$RECOVER_RUN" > "$RUNNER_TEMP/recover-run.json"
          jq -e '.head_branch == "main" and .path == ".github/workflows/pdf-ocr-assets.yml" and .status == "completed"' "$RUNNER_TEMP/recover-run.json"
      - uses: actions/download-artifact@v8
        with:
          name: pdf-image-ocr-queue
          path: output/pdf-ocr
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recover_run || github.run_id }}
      - uses: actions/download-artifact@v8
        if: needs.build.result != 'skipped' || inputs.recover_run != ''
        with:
          pattern: pdf-image-ocr-results-*
          path: output/pdf-ocr/results
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recover_run || github.run_id }}
      - name: Save page progress and publish complete books
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_HF_TOKEN: ${{ secrets.ARCHIVE_HF_TOKEN }}
          PDF_OCR_LANG: ${{ inputs.lang || 'auto' }}
          PDF_OCR_BACKEND: ${{ inputs.backend || 'rapidocr_onnxruntime' }}
        run: python scripts/pdf_ocr_stages.py publish-ocr --results-dir output/pdf-ocr/results
      - name: Dispatch next stale render repair batch
        if: success() && inputs.recover_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/dispatch_pdf_stages.py repair-stale --queue output/pdf-ocr/queue.json
      - name: Queue Reader sidecar publication in main pipeline
        if: ${{ inputs.source_repo != '' && inputs.source_path_prefix != '' }}
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo || '' }}
          SOURCE_PATH_PREFIX: ${{ inputs.source_path_prefix || '' }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          test -n "${SOURCE_REPO}"
          test -n "${SOURCE_PATH_PREFIX}"
          jq -n --arg repo "$SOURCE_REPO" --arg path "$SOURCE_PATH_PREFIX" \
            '{ref:"main",inputs:{repo:$repo,path:$path,limit:"1",checkpoint_batches:"1",bucket_migrate:true,bucket_pdf_staging:false}}' \
            > "$RUNNER_TEMP/reader-assets-dispatch.json"
          curl --fail-with-body --silent --show-error -X POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/reader-assets-dispatch.json" \
            "https://api.github.com/repos/anftm/pipeline/actions/workflows/reader-assets.yml/dispatches"
